name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask realmui.github.io to rebuild the site
        env:
          GH_TOKEN: ${{ secrets.REALM_PAT }}
        run: gh api repos/realmui/realmui.github.io/dispatches -f event_type=realm-main
