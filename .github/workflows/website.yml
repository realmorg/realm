name: Website

on:
  push:
    branches: [main]
    # None of these files appear on the website.
    paths-ignore:
      - "**/README.md"
      - "**/CHANGELOG.md"
      - "**/LICENSE"
      - ".github/CONTRIBUTING.md"
      - "PLAN.md"
      - ".changeset/*.md"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask realmorg.github.io to rebuild the site
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone -q --depth 1 git@github.com:realmorg/realmorg.github.io.git rebuild && cd rebuild
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q --allow-empty -m "Rebuild from realmorg/realm@${GITHUB_SHA}"
          git push -f origin HEAD:rebuild
          # The push alone starts the deploy, which builds realm's main, so the branch can go.
          git push origin --delete rebuild
