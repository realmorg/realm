name: Release

on:
  push:
    branches: [main]
    # Changesets are not ignored: a new changeset opens the Version Packages pull request.
    paths-ignore:
      - "**/README.md"
      - "**/CHANGELOG.md"
      - "**/LICENSE"
      - ".github/CONTRIBUTING.md"
      - "PLAN.md"

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm release:check
      - id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      - if: steps.changesets.outputs.published == 'true'
        name: Refresh the jsDelivr cache for the published packages
        run: node scripts/purge-cdn.mjs '${{ steps.changesets.outputs.publishedPackages }}'
