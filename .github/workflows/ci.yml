name: CI

# A change that only touches the files below is not read by any check, so CI does not run.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/README.md"
      - "**/CHANGELOG.md"
      - "**/LICENSE"
      - ".github/CONTRIBUTING.md"
      - "PLAN.md"
      - ".changeset/*.md"
  pull_request:
    paths-ignore:
      - "**/README.md"
      - "**/CHANGELOG.md"
      - "**/LICENSE"
      - ".github/CONTRIBUTING.md"
      - "PLAN.md"
      - ".changeset/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm spec
      - run: pnpm build
      - run: pnpm size
      - run: pnpm skill:check
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      # Playwright's download server sometimes hangs, so the download is retried. System packages
      # install in their own step: killing a timed-out apt-get would leave the dpkg lock held.
      - run: pnpm --filter @realmorg/realm exec playwright install-deps chromium
      - run: |
          for attempt in 1 2 3; do
            timeout 5m pnpm --filter @realmorg/realm exec playwright install chromium && exit 0
            echo "::warning::Browser install attempt $attempt failed, retrying"
          done
          exit 1
      - run: pnpm skill:test
      - run: pnpm scripts:test

  # Each browser runs once: Chromium measures coverage, Firefox and WebKit run the cross-browser suite.
  packages:
    name: ${{ matrix.package }} (${{ matrix.browsers }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: "@realmorg/realm", browsers: chromium, run: coverage }
          - { package: "@realmorg/realm", browsers: firefox webkit, run: "test:cross" }
          - { package: "@realmorg/ui", browsers: chromium, run: coverage }
          - { package: "@realmorg/ui", browsers: firefox webkit, run: "test:cross" }
          - { package: "@realmorg/unicons", browsers: chromium, run: coverage }
          - { package: "@realmorg/unicons", browsers: firefox webkit, run: "test:cross" }
          - { package: "@realmorg/vite-plugin", browsers: chromium firefox webkit, run: test }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browsers }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Playwright's download server sometimes hangs, so the download is retried. System packages
      # install in their own step: killing a timed-out apt-get would leave the dpkg lock held.
      - run: pnpm --filter "${{ matrix.package }}" exec playwright install-deps ${{ matrix.browsers }}
      - run: |
          for attempt in 1 2 3; do
            timeout 5m pnpm --filter "${{ matrix.package }}" exec playwright install ${{ matrix.browsers }} && exit 0
            echo "::warning::Browser install attempt $attempt failed, retrying"
          done
          exit 1
      - run: pnpm turbo run build --filter="${{ matrix.package }}..."
      - run: pnpm --filter "${{ matrix.package }}" ${{ matrix.run }}

  site:
    name: site (${{ matrix.browser }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, run: coverage }
          - { browser: firefox, shard: 1/2 }
          - { browser: firefox, shard: 2/2 }
          - { browser: webkit, shard: 1/2 }
          - { browser: webkit, shard: 2/2 }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Playwright's download server sometimes hangs, so the download is retried. System packages
      # install in their own step: killing a timed-out apt-get would leave the dpkg lock held.
      - run: pnpm --filter site exec playwright install-deps ${{ matrix.browser }}
      - run: |
          for attempt in 1 2 3; do
            timeout 5m pnpm --filter site exec playwright install ${{ matrix.browser }} && exit 0
            echo "::warning::Browser install attempt $attempt failed, retrying"
          done
          exit 1
      # The tests build the site themselves. They need the packages it is made from.
      - run: pnpm turbo run build --filter="site^..." --filter="@realmorg/unicons"
      - if: matrix.run == 'coverage'
        run: pnpm --filter site coverage
      - if: matrix.run != 'coverage'
        run: pnpm --filter site exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: apps/site/test-results
