name: CI

# A change that only touches the files below is not read by any check, so CI does not run.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/README.md"
      - "**/CHANGELOG.md"
      - "**/LICENSE"
      - ".github/CONTRIBUTING.md"
      - "PLAN.md"
      - ".changeset/*.md"
  pull_request:
    paths-ignore:
      - "**/README.md"
      - "**/CHANGELOG.md"
      - "**/LICENSE"
      - ".github/CONTRIBUTING.md"
      - "PLAN.md"
      - ".changeset/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Microsoft's Playwright image has every browser and its system packages preinstalled, so no
    # job downloads browsers or runs apt-get, which both hang on the runners now and then. The
    # image version must match the playwright package; the check job compares them.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm spec
      - run: pnpm build
      - run: pnpm size
      - run: pnpm skill:check
      - name: The Playwright image matches the playwright package
        run: |
          installed=$(pnpm --filter @realmorg/realm exec node -p "require('playwright/package.json').version")
          image=$(grep -o 'mcr.microsoft.com/playwright:v[0-9][0-9.]*' .github/workflows/ci.yml | sort -u)
          echo "playwright $installed, $image"
          test "$image" = "mcr.microsoft.com/playwright:v$installed"
      - run: pnpm skill:test
      - run: pnpm scripts:test

  # Each browser runs once: Chromium measures coverage, Firefox and WebKit run the cross-browser suite.
  packages:
    name: ${{ matrix.package }} (${{ matrix.browsers }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Microsoft's Playwright image has every browser and its system packages preinstalled, so no
    # job downloads browsers or runs apt-get, which both hang on the runners now and then. The
    # image version must match the playwright package; the check job compares them.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: "@realmorg/realm", browsers: chromium, run: coverage }
          - { package: "@realmorg/realm", browsers: firefox webkit, run: "test:cross" }
          - { package: "@realmorg/ui", browsers: chromium, run: coverage }
          - { package: "@realmorg/ui", browsers: firefox webkit, run: "test:cross" }
          - { package: "@realmorg/unicons", browsers: chromium, run: coverage }
          - { package: "@realmorg/unicons", browsers: firefox webkit, run: "test:cross" }
          - { package: "@realmorg/vite-plugin", browsers: chromium firefox webkit, run: test }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build --filter="${{ matrix.package }}..."
      - run: pnpm --filter "${{ matrix.package }}" ${{ matrix.run }}

  site:
    name: site (${{ matrix.browser }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Microsoft's Playwright image has every browser and its system packages preinstalled, so no
    # job downloads browsers or runs apt-get, which both hang on the runners now and then. The
    # image version must match the playwright package; the check job compares them.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, run: coverage }
          - { browser: firefox, shard: 1/2 }
          - { browser: firefox, shard: 2/2 }
          - { browser: webkit, shard: 1/2 }
          - { browser: webkit, shard: 2/2 }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # The tests build the site themselves. They need the packages it is made from.
      - run: pnpm turbo run build --filter="site^..." --filter="@realmorg/unicons"
      - if: matrix.run == 'coverage'
        run: pnpm --filter site coverage
      - if: matrix.run != 'coverage'
        run: pnpm --filter site exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: apps/site/test-results
