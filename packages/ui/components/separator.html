<custom-element name="ui-separator" role="separator">
  <script>
    const props = defineProps({
      orientation: prop.enum(["horizontal", "vertical"]).default("horizontal"),
    });
    observe(() => {
      internals.ariaOrientation = props.orientation;
    });
  </script>

  <style>
    /* A double tap must not zoom the page. Set inside the shadow root, because a page-level
       touch-action does not reach shadow content in iOS Safari. */
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: block;
      flex-shrink: 0;
      height: 1px;
      width: 100%;
      background: var(--border);
    }
    :host(:state(attr-orientation-is-vertical)) {
      height: auto;
      width: 1px;
      align-self: stretch;
    }
  </style>
</custom-element>
