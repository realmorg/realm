<custom-element name="ui-spinner" role="status">
  <script>
    const props = defineProps({
      size: prop.number().min(8).default(16),
      label: prop.string().default("Loading"),
      variant: prop.enum(["default", "primary", "muted", "destructive"]).default("default"),
    });

    observe(() => {
      internals.ariaLabel = props.label;
    });
  </script>

  <style>
    /* A double tap must not zoom the page. Set inside the shadow root, because a page-level
       touch-action does not reach shadow content in iOS Safari. */
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: inline-flex;
      width: calc(var(--attr-size) * 1px);
      height: calc(var(--attr-size) * 1px);
    }
    :host(:state(attr-variant-is-primary)) {
      color: var(--primary);
    }
    :host(:state(attr-variant-is-muted)) {
      color: var(--muted-foreground);
    }
    :host(:state(attr-variant-is-destructive)) {
      color: var(--destructive);
    }
    svg {
      width: 100%;
      height: 100%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to {
        rotate: 360deg;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      svg {
        animation-duration: 2.4s;
      }
    }
  </style>

  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
</custom-element>
