<custom-element name="ui-aspect-ratio">
  <script>
    defineProps({ ratio: prop.string().default("16 / 9") });
  </script>

  <style>
    /* A double tap must not zoom the page. Set inside the shadow root, because a page-level
       touch-action does not reach shadow content in iOS Safari. */
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: block;
      position: relative;
      aspect-ratio: var(--attr-ratio);
      overflow: hidden;
    }
    ::slotted(img),
    ::slotted(video),
    ::slotted(iframe) {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>

  <slot></slot>
</custom-element>
