<custom-element name="ui-item">
  <script>
    defineProps({
      variant: prop.enum(["default", "outline", "muted"]).default("default"),
      size: prop.enum(["default", "sm"]).default("default"),
    });

    onConnected(() => {
      internals.role = host.parentElement?.localName === "ui-item-group" ? "listitem" : null;
    });
  </script>

  <style>
    /* A double tap must not zoom the page. Set inside the shadow root, because a page-level
       touch-action does not reach shadow content in iOS Safari. */
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: calc(var(--spacing) * 4);
      padding: calc(var(--spacing) * 4);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      transition: background-color 0.1s;
    }
    :host(:state(attr-variant-is-outline)) {
      border-color: var(--border);
    }
    :host(:state(attr-variant-is-muted)) {
      background: color-mix(in oklab, var(--muted) 50%, transparent);
    }
    :host(:state(attr-size-is-sm)) {
      gap: calc(var(--spacing) * 2.5);
      padding: calc(var(--spacing) * 3) calc(var(--spacing) * 4);
    }
  </style>

  <slot></slot>
</custom-element>

<custom-element name="ui-item-group" role="list">
  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: flex;
      flex-direction: column;
    }
  </style>

  <slot></slot>
</custom-element>

<custom-element name="ui-item-media">
  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      gap: calc(var(--spacing) * 2);
    }
    :host(:state(attr-variant-is-icon)) {
      box-sizing: border-box;
      width: calc(var(--spacing) * 8);
      height: calc(var(--spacing) * 8);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--muted);
    }
    :host(:state(attr-variant-is-image)) {
      width: calc(var(--spacing) * 10);
      height: calc(var(--spacing) * 10);
      overflow: hidden;
      border-radius: var(--radius-sm);
    }
    ::slotted(svg) {
      width: calc(var(--spacing) * 4);
      height: calc(var(--spacing) * 4);
    }
    :host(:state(attr-variant-is-image)) ::slotted(img) {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>

  <slot></slot>
</custom-element>

<custom-element name="ui-item-content">
  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: calc(var(--spacing) * 1);
      min-width: 0;
    }
  </style>

  <slot></slot>
</custom-element>

<custom-element name="ui-item-title">
  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: flex;
      align-items: center;
      gap: calc(var(--spacing) * 2);
      font-weight: var(--font-weight-medium);
      line-height: 1.25;
    }
  </style>

  <slot></slot>
</custom-element>

<custom-element name="ui-item-description">
  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      color: var(--muted-foreground);
      line-height: 1.4;
      text-wrap: balance;
    }
  </style>

  <slot></slot>
</custom-element>

<custom-element name="ui-item-actions">
  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: flex;
      align-items: center;
      gap: calc(var(--spacing) * 2);
    }
  </style>

  <slot></slot>
</custom-element>

<custom-element name="ui-item-header">
  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: flex;
      flex-basis: 100%;
      align-items: center;
      justify-content: space-between;
      gap: calc(var(--spacing) * 2);
    }
  </style>

  <slot></slot>
</custom-element>

<custom-element name="ui-item-footer">
  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: flex;
      flex-basis: 100%;
      align-items: center;
      justify-content: space-between;
      gap: calc(var(--spacing) * 2);
    }
  </style>

  <slot></slot>
</custom-element>
