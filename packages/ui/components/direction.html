<custom-element name="ui-direction">
  <script>
    const props = defineProps({ dir: prop.enum(["ltr", "rtl"]).default("ltr") });

    observe(() => {
      attrs.dir = props.dir;
    });
  </script>

  <style>
    /* A double tap must not zoom the page. Set inside the shadow root, because a page-level
       touch-action does not reach shadow content in iOS Safari. */
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: contents;
    }
  </style>

  <slot></slot>
</custom-element>
