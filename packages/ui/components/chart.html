<custom-element name="ui-chart">
  <script>
    const props = defineProps({
      type: prop.enum(["bar", "line", "area"]).default("bar"),
      variant: prop.enum(["default", "sparkline"]).default("default"),
      data: prop.array(prop.object()).default([]),
      x: prop.string().default("label"),
      y: prop.string().default("value"),
      height: prop.number().min(16).default(240),
      label: prop.string().default("Chart"),
    });

    const PADDING = {
      default: { top: 12, right: 12, bottom: 28, left: 44 },
      sparkline: { top: 2, right: 2, bottom: 2, left: 2 },
    };
    const NICE_STEPS = [1, 2, 2.5, 5, 10];
    const compact = new Intl.NumberFormat(undefined, { notation: "compact" });

    const chart = useState({
      width: 600,
      get pad() {
        return PADDING[props.variant];
      },
      get right() {
        return this.width - this.pad.right;
      },
      get series() {
        return props.y.split(",").map((key, index) => ({ key: key.trim(), color: `var(--chart-${(index % 5) + 1})` }));
      },
      get values() {
        return props.data.flatMap((row) => this.series.map((series) => Number(row[series.key]) || 0));
      },
      get step() {
        const rough = (Math.max(1, ...this.values) - Math.min(0, ...this.values)) / 4;
        const magnitude = 10 ** Math.floor(Math.log10(rough));
        return magnitude * NICE_STEPS.find((step) => step * magnitude >= rough);
      },
      get max() {
        return Math.ceil(Math.max(1, ...this.values) / this.step) * this.step;
      },
      get min() {
        return Math.floor(Math.min(0, ...this.values) / this.step) * this.step;
      },
      get plotHeight() {
        return props.height - this.pad.top - this.pad.bottom;
      },
      y(value) {
        return this.pad.top + this.plotHeight * ((this.max - value) / (this.max - this.min));
      },
      get band() {
        return (this.right - this.pad.left) / Math.max(1, props.data.length);
      },
      pointX(index) {
        const edgeToEdge = props.variant === "sparkline" && props.data.length > 1;
        return edgeToEdge
          ? this.pad.left + ((this.right - this.pad.left) * index) / (props.data.length - 1)
          : this.pad.left + this.band * (index + 0.5);
      },
      get viewBox() {
        return `0 0 ${this.width} ${props.height}`;
      },
      get ticks() {
        const count = Math.round((this.max - this.min) / this.step);
        return Array.from({ length: count + 1 }, (_, index) => {
          const value = this.min + this.step * index;
          return { key: index, y: this.y(value), label: compact.format(value) };
        });
      },
      get labels() {
        return props.data.map((row, index) => ({ key: index, x: this.pad.left + this.band * (index + 0.5), text: String(row[props.x] ?? "") }));
      },
      get bars() {
        const width = (this.band * 0.7) / this.series.length;
        return props.data.flatMap((row, index) =>
          this.series.map((series, s) => {
            const value = Number(row[series.key]) || 0;
            const top = this.y(Math.max(value, 0));
            return {
              key: `${index}-${series.key}`,
              x: this.pad.left + this.band * index + this.band * 0.15 + width * s,
              y: top,
              width,
              height: this.y(Math.min(value, 0)) - top,
              color: series.color,
              title: `${row[props.x]} · ${series.key}: ${value.toLocaleString()}`,
            };
          }),
        );
      },
      get lines() {
        return this.series.map((series) => {
          const points = props.data.map((row, index) => [
            this.pointX(index),
            this.y(Number(row[series.key]) || 0),
          ]);
          const line = points.map(([x, y], index) => `${index ? "L" : "M"}${x},${y}`).join(" ");
          const zero = this.y(0);
          const area = points.length ? `${line} L${points.at(-1)[0]},${zero} L${points[0][0]},${zero} Z` : "";
          return { key: series.key, line, area, color: series.color };
        });
      },
      get legend() {
        return this.series.length > 1 ? this.series : [];
      },
    });

    const resize = new ResizeObserver(([entry]) => {
      if (entry.contentRect.width) chart.width = entry.contentRect.width;
    });

    onConnected(() => {
      if (host.clientWidth) chart.width = host.clientWidth;
      resize.observe(host);
      return () => resize.disconnect();
    });
  </script>

  <style>
    /* A double tap must not zoom the page. Set inside the shadow root, because a page-level
       touch-action does not reach shadow content in iOS Safari. */
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: block;
      width: 100%;
      box-sizing: border-box;
      font-size: var(--text-xs);
      color: var(--muted-foreground);
    }
    svg {
      display: block;
      width: 100%;
      overflow: visible;
    }
    .grid {
      stroke: var(--border);
      stroke-dasharray: 3 3;
    }
    .tick {
      fill: currentColor;
      text-anchor: end;
      dominant-baseline: middle;
    }
    .label {
      fill: currentColor;
      text-anchor: middle;
    }
    rect {
      rx: 4;
    }
    .line {
      fill: none;
      stroke-width: 2;
    }
    .area {
      opacity: 0.2;
    }
    :host(:state(attr-variant-is-sparkline)) :is(.axes, .label, .legend) {
      display: none;
    }
    :host(:not(:state(attr-type-is-bar))) .bars,
    :host(:state(attr-type-is-bar)) .lines,
    :host(:not(:state(attr-type-is-area))) .area {
      display: none;
    }
    .legend {
      display: flex;
      justify-content: center;
      gap: calc(var(--spacing) * 4);
      margin-top: calc(var(--spacing) * 2);
    }
    .legend span::before {
      content: "";
      display: inline-block;
      width: calc(var(--spacing) * 2.5);
      height: calc(var(--spacing) * 2.5);
      margin-right: calc(var(--spacing) * 1.5);
      border-radius: var(--radius-xs);
      background: var(--swatch);
    }
  </style>

  <svg _viewBox="#chart.viewBox" _height="@height" role="img" _aria-label="@label" part="svg">
    <g class="axes" repeat="#chart.ticks" as="tick" key="key">
      <line class="grid" _x1="#chart.pad.left" _x2="#chart.right" _y1="#tick.y" _y2="#tick.y"></line>
      <text class="tick" _x="#chart.pad.left" dx="-6" _y="#tick.y"><slot name="#tick.label"></slot></text>
    </g>
    <text repeat="#chart.labels" as="label" key="key" class="label" _x="#label.x" _y="@height" dy="-8"><slot name="#label.text"></slot></text>
    <g class="bars">
      <rect repeat="#chart.bars" as="bar" key="key" _x="#bar.x" _y="#bar.y" _width="#bar.width" _height="#bar.height" _fill="#bar.color"><title><slot name="#bar.title"></slot></title></rect>
    </g>
    <g class="lines" repeat="#chart.lines" as="series" key="key">
      <path class="area" _d="#series.area" _fill="#series.color"></path>
      <path class="line" _d="#series.line" _stroke="#series.color"></path>
    </g>
  </svg>
  <div class="legend" part="legend">
    <span repeat="#chart.legend" as="series" key="key" _--swatch="#series.color"><slot name="#series.key"></slot></span>
  </div>
</custom-element>
