<custom-element name="ui-label">
  <script>
    const props = defineProps({ for: prop.string() });

    const CHECKABLE = new Set(["checkbox", "radio"]);

    function target() {
      return props.for ? host.getRootNode().getElementById(props.for) : null;
    }

    function activate() {
      const field = target();
      if (!field) return;
      field.focus();
      if (CHECKABLE.has(field.type) || "checked" in field) (field.shadowRoot?.querySelector('[ref="control"]') ?? field).click();
    }

    function labelField(retry = true) {
      const field = target();
      if (!field || field.hasAttribute("aria-label")) return;
      if (field.localName.includes("-") && !field.shadowRoot) {
        if (retry) customElements.whenDefined(field.localName).then(() => labelField(false));
        return;
      }
      const control = field.shadowRoot ? field.shadowRoot.querySelector('[ref="control"]') : field;
      if (control) control.ariaLabelledByElements = [host];
    }

    onConnected(labelField);
  </script>

  <style>
    /* A double tap must not zoom the page. Set inside the shadow root, because a page-level
       touch-action does not reach shadow content in iOS Safari. */
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: inline-flex;
      align-items: center;
      gap: calc(var(--spacing) * 2);
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      line-height: 1;
      user-select: none;
    }
    :host(:state(attr-for)) {
      cursor: pointer;
    }
  </style>

  <span part="label" onclick="activate()"><slot></slot></span>
</custom-element>
