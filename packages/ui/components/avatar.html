<custom-element name="ui-avatar">
  <script>
    defineProps({
      size: prop.enum(["sm", "default", "lg"]).default("default"),
      shape: prop.enum(["circle", "square"]).default("circle"),
    });

    const image = useState({ failed: false, loaded: false });

    function loaded() {
      image.loaded = true;
      image.failed = false;
    }

    function failed() {
      image.failed = true;
    }
  </script>

  <style>
    /* A double tap must not zoom the page. Set inside the shadow root, because a page-level
       touch-action does not reach shadow content in iOS Safari. */
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      position: relative;
      display: inline-flex;
      flex-shrink: 0;
      width: calc(var(--spacing) * 8);
      height: calc(var(--spacing) * 8);
      overflow: hidden;
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      vertical-align: middle;
    }
    :host(:state(attr-size-is-sm)) {
      width: calc(var(--spacing) * 6);
      height: calc(var(--spacing) * 6);
      font-size: var(--text-xs);
    }
    :host(:state(attr-size-is-lg)) {
      width: calc(var(--spacing) * 10);
      height: calc(var(--spacing) * 10);
    }
    :host(:state(attr-shape-is-square)) {
      border-radius: var(--radius-md);
    }
  </style>

  <slot></slot>
</custom-element>

<custom-element name="ui-avatar-image">
  <script>
    defineProps({
      src: prop.string(),
      alt: prop.string().default(""),
    });
  </script>

  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: contents;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>

  <is-hidden when="#image.failed">
    <img part="image" _src="@src" _alt="@alt" _hidden="!#image.loaded" onload="loaded()" onerror="failed()">
  </is-hidden>
</custom-element>

<custom-element name="ui-avatar-fallback">
  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: contents;
    }
    span {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding-inline-end: var(--ui-avatar-covered, 0);
      background: var(--muted);
      color: var(--muted-foreground);
    }
  </style>

  <is-hidden when="#image.loaded">
    <span part="fallback"><slot></slot></span>
  </is-hidden>
</custom-element>

<custom-element name="ui-avatar-group" role="group">
  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: flex;
      align-items: center;
    }
    ::slotted(*) {
      --ui-avatar-ring: calc(var(--spacing) * 0.5);
      --ui-avatar-overlap: calc(var(--spacing) * 1.5);
      box-shadow: 0 0 0 var(--ui-avatar-ring) var(--background);
    }
    ::slotted([size="sm"]) {
      --ui-avatar-overlap: calc(var(--spacing) * 0.75);
    }
    ::slotted([size="lg"]) {
      --ui-avatar-overlap: calc(var(--spacing) * 2);
    }
    ::slotted(:not(:first-child)) {
      margin-inline-start: calc(var(--ui-avatar-overlap) * -1);
    }
    /* The next avatar and its ring cover the end of this one, so the initials centre in what stays visible. */
    ::slotted(:not(:last-child)) {
      --ui-avatar-covered: calc(var(--ui-avatar-overlap) + var(--ui-avatar-ring));
    }
  </style>

  <slot></slot>
</custom-element>

<custom-element name="ui-avatar-group-count">
  <script>
    defineProps({ size: prop.enum(["sm", "default", "lg"]).default("default") });
  </script>

  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      min-width: calc(var(--spacing) * 8);
      height: calc(var(--spacing) * 8);
      padding-inline: calc(var(--spacing) * 1.5);
      border-radius: var(--radius-full);
      background: var(--muted);
      color: var(--muted-foreground);
      font-size: var(--text-sm);
      white-space: nowrap;
    }
    :host(:state(attr-size-is-sm)) {
      min-width: calc(var(--spacing) * 6);
      height: calc(var(--spacing) * 6);
      padding-inline: var(--spacing);
      font-size: var(--text-xs);
    }
    :host(:state(attr-size-is-lg)) {
      min-width: calc(var(--spacing) * 10);
      height: calc(var(--spacing) * 10);
    }
  </style>

  <slot></slot>
</custom-element>
