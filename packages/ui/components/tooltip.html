<custom-element name="ui-tooltip">
  <script>
    const props = defineProps({
      delay: prop.number().min(0).default(300),
    });

    const parts = useChildren("ui-tooltip-trigger, ui-tooltip-content");

    let timer;

    function tip() {
      return parts.find((part) => part.localName === "ui-tooltip-content");
    }

    function show(trigger) {
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (!tip().matches(":popover-open")) tip().showPopover({ source: trigger });
      }, props.delay);
    }

    function hide() {
      clearTimeout(timer);
      if (tip().matches(":popover-open")) tip().hidePopover();
    }

    function key(event) {
      if (event.key === "Escape") hide();
    }

    function describe() {
      const text = tip()?.textContent.trim() ?? "";
      for (const trigger of parts.filter((part) => part.localName === "ui-tooltip-trigger"))
        for (const element of trigger.children) element.setAttribute("aria-description", text);
    }

    observe(describe);
  </script>

  <style>
    /* A double tap must not zoom the page. Set inside the shadow root, because a page-level
       touch-action does not reach shadow content in iOS Safari. */
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: contents;
    }
  </style>

  <slot></slot>
</custom-element>

<custom-element name="ui-tooltip-trigger">
  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: inline-block;
      vertical-align: middle;
    }
  </style>

  <span part="trigger" onpointerenter="show(host)" onpointerleave="hide()" onfocusin="show(host)" onfocusout="hide()" onkeydown="key(event)"><slot></slot></span>
</custom-element>

<custom-element name="ui-tooltip-content" role="tooltip">
  <script>
    const props = defineProps({
      placement: prop.enum(["top", "bottom", "left", "right"]).default("top"),
    });

    const BLOCK_SIDES = new Set(["top", "bottom"]);

    // Once open, it keeps the side it opened on. Re-deciding while the page scrolls makes it jump,
    // because iOS Safari's toolbar changes the viewport height mid-scroll.
    function opened(event) {
      internals.states.delete("flipped");
      if (event.newState !== "open" || !BLOCK_SIDES.has(props.placement)) return;
      const box = host.getBoundingClientRect();
      if (box.bottom > innerHeight || box.top < 0) internals.states.add("flipped");
    }

    attrs.popover ??= "manual";

    listen("toggle", opened);
  </script>

  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      margin: 0 0 calc(var(--spacing) * 1);
      padding: calc(var(--spacing) * 1.5) calc(var(--spacing) * 3);
      border: 0;
      border-radius: var(--radius-md);
      background: var(--foreground);
      color: var(--background);
      font-size: var(--text-xs);
      inset: auto;
      height: fit-content;
      max-height: calc(100svh - calc(var(--spacing) * 8));
      overflow-y: auto;
      position-area: top;
      position-try-fallbacks: flip-block;
    }
    :host(:state(attr-placement-is-bottom)) {
      position-area: bottom;
      margin: calc(var(--spacing) * 1) 0 0;
    }
    :host(:popover-open) {
      position-try-fallbacks: none;
    }
    :host(:state(flipped)) {
      position-area: bottom;
      margin: calc(var(--spacing) * 1) 0 0;
    }
    :host(:state(flipped):state(attr-placement-is-bottom)) {
      position-area: top;
      margin: 0 0 calc(var(--spacing) * 1);
    }
    :host(:state(attr-placement-is-left)) {
      position-area: left;
      margin: 0 calc(var(--spacing) * 1) 0 0;
    }
    :host(:state(attr-placement-is-right)) {
      position-area: right;
      margin: 0 0 0 calc(var(--spacing) * 1);
    }
  </style>

  <slot></slot>
</custom-element>
