<custom-element name="ui-attachment">
  <script>
    defineProps({ name: prop.string(), size: prop.string(), href: prop.string() });
  </script>

  <style>
    :host {
      display: inline-flex;
      align-items: center;
      gap: calc(var(--spacing) * 2);
      max-width: 100%;
      min-width: 0;
      padding: calc(var(--spacing) * 2) calc(var(--spacing) * 2.5);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: var(--card);
      color: var(--card-foreground);
      font-size: var(--text-sm);
    }
    :host(:focus-within) {
      box-shadow: 0 0 0 1px var(--ring);
    }
    .content {
      display: grid;
      min-width: 0;
    }
    .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: var(--font-weight-medium);
      color: inherit;
      text-decoration: none;
    }
    .size {
      font-size: var(--text-xs);
      color: var(--muted-foreground);
    }
  </style>

  <slot name="media"></slot>
  <div class="content" part="content">
    <a class="title" part="title" _href="@href" _download="@name"><slot name="@name"></slot></a>
    <span class="size" _hidden="!@size"><slot name="@size"></slot></span>
  </div>
  <slot name="actions"></slot>
</custom-element>

<custom-element name="ui-attachment-media" slot="media">
  <style>
    :host {
      display: grid;
      place-content: center;
      flex-shrink: 0;
      width: calc(var(--spacing) * 8);
      height: calc(var(--spacing) * 8);
      overflow: hidden;
      border-radius: var(--radius-md);
      background: var(--muted);
    }
    ::slotted(svg) {
      width: calc(var(--spacing) * 4);
      height: calc(var(--spacing) * 4);
    }
    ::slotted(img) {
      width: calc(var(--spacing) * 8);
      height: calc(var(--spacing) * 8);
      object-fit: cover;
    }
  </style>

  <slot></slot>
</custom-element>

<custom-element name="ui-attachment-actions" slot="actions">
  <style>
    :host {
      display: flex;
      gap: calc(var(--spacing) * 1);
    }
  </style>

  <slot></slot>
</custom-element>
