<custom-element name="ui-button-group" role="group">
  <script>
    defineProps({ orientation: prop.enum(["horizontal", "vertical"]).default("horizontal") });
  </script>

  <style>
    /* A double tap must not zoom the page. Set inside the shadow root, because a page-level
       touch-action does not reach shadow content in iOS Safari. */
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: inline-flex;
      align-items: stretch;
      width: fit-content;
    }
    :host(:state(attr-orientation-is-vertical)) {
      flex-direction: column;
    }
    :host(:not(:state(attr-orientation-is-vertical))) ::slotted(:not(:first-child)) {
      --ui-radius-start: 0;
      margin-inline-start: -1px;
    }
    :host(:not(:state(attr-orientation-is-vertical))) ::slotted(:not(:last-child)) {
      --ui-radius-end: 0;
    }
    :host(:state(attr-orientation-is-vertical)) ::slotted(:not(:first-child)) {
      --ui-radius-block-start: 0;
      margin-block-start: -1px;
    }
    :host(:state(attr-orientation-is-vertical)) ::slotted(:not(:last-child)) {
      --ui-radius-block-end: 0;
    }
  </style>

  <slot></slot>
</custom-element>

<custom-element name="ui-button-group-text">
  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: flex;
      align-items: center;
      gap: calc(var(--spacing) * 2);
      padding: 0 calc(var(--spacing) * 4);
      border: 1px solid var(--border);
      border-start-start-radius: var(--ui-radius-block-start, var(--ui-radius-start, var(--radius-md)));
      border-end-start-radius: var(--ui-radius-block-end, var(--ui-radius-start, var(--radius-md)));
      border-start-end-radius: var(--ui-radius-block-start, var(--ui-radius-end, var(--radius-md)));
      border-end-end-radius: var(--ui-radius-block-end, var(--ui-radius-end, var(--radius-md)));
      background: var(--muted);
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      white-space: nowrap;
      box-shadow: var(--shadow-xs);
    }
    ::slotted(svg) {
      width: calc(var(--spacing) * 4);
      height: calc(var(--spacing) * 4);
      flex-shrink: 0;
    }
  </style>

  <slot></slot>
</custom-element>

<custom-element name="ui-button-group-separator" role="separator">
  <script>
    const props = defineProps({ orientation: prop.enum(["vertical", "horizontal"]).default("vertical") });

    observe(() => {
      internals.ariaOrientation = props.orientation;
    });
  </script>

  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      position: relative;
      z-index: 1;
      align-self: stretch;
      inline-size: 1px;
      background: var(--input);
    }
    :host(:state(attr-orientation-is-horizontal)) {
      inline-size: auto;
      block-size: 1px;
    }
  </style>
</custom-element>
