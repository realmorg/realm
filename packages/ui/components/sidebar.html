<custom-element name="ui-sidebar-layout">
  <script>
    const props = defineProps({
      collapsed: prop.boolean().reflect(),
      persist: prop.string(),
    });

    const media = matchMedia("(max-width: 767px)");
    const layout = useState({ mobile: media.matches, open: false });

    function toggle() {
      if (layout.mobile) layout.open = !layout.open;
      else props.collapsed = !props.collapsed;
    }

    function close() {
      layout.open = false;
    }

    function shortcut(event) {
      if (event.key.toLowerCase() !== "b" || !(event.metaKey || event.ctrlKey)) return;
      event.preventDefault();
      toggle();
    }

    if (props.persist) props.collapsed = localStorage.getItem(props.persist) === "true";

    defineMethods({ toggle });

    listen("sidebartoggle", toggle);
    listen("keydown", shortcut, document);
    listen("change", () => (layout.mobile = media.matches), media);

    observe(() => {
      if (props.persist) localStorage.setItem(props.persist, String(props.collapsed));
    });
  </script>

  <style>
    :host {
      --ui-sidebar-width: calc(var(--spacing) * 64);
      --ui-sidebar-label: block;
      display: flex;
      min-height: 100dvh;
      background: var(--sidebar);
    }
    :host(:state(attr-collapsed)) {
      --ui-sidebar-width: calc(var(--spacing) * 12);
      --ui-sidebar-label: none;
    }
    .sidebar {
      position: sticky;
      top: 0;
      width: var(--ui-sidebar-width);
      height: 100dvh;
      flex-shrink: 0;
      transition: width 0.2s ease;
    }
    .backdrop {
      display: none;
    }
    :host(:state(state-layout-mobile)) {
      --ui-sidebar-width: calc(var(--spacing) * 72);
      --ui-sidebar-label: block;
      --ui-sidebar-inset-margin: 0;
      --ui-sidebar-inset-radius: 0;
    }
    :host(:state(state-layout-mobile)) .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 50;
      translate: -100% 0;
      transition: translate 0.2s ease;
    }
    :host(:state(state-layout-open)) .sidebar {
      translate: 0 0;
    }
    :host(:state(state-layout-open)) .backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: block;
      background: rgb(0 0 0 / 0.5);
    }
  </style>

  <aside class="sidebar" part="sidebar"><slot name="sidebar"></slot></aside>
  <div class="backdrop" part="backdrop" onclick="close()"></div>
  <slot></slot>
</custom-element>

<custom-element name="ui-sidebar-menu-button">
  <script>
    const props = defineProps({
      href: prop.string(),
      current: prop.boolean(),
      label: prop.string(),
    });

    const item = useState({
      get current() {
        return props.current ? "page" : null;
      },
      get role() {
        return props.href ? null : "button";
      },
    });

    const ACTIVATE = { Enter: true, " ": true };

    function pressed(event) {
      if (!dispatch("select")) event.preventDefault();
    }

    function key(event) {
      if (props.href || !ACTIVATE[event.key]) return;
      event.preventDefault();
      event.currentTarget.click();
    }
  </script>

  <style>
    :host {
      display: block;
    }
    a {
      display: flex;
      align-items: center;
      gap: calc(var(--spacing) * 2);
      height: calc(var(--spacing) * 8);
      padding: 0 calc(var(--spacing) * 2);
      border-radius: var(--radius-md);
      overflow: hidden;
      color: inherit;
      font-size: var(--text-sm);
      text-decoration: none;
      white-space: nowrap;
      outline: none;
      cursor: pointer;
    }
    a:hover,
    a:focus-visible,
    :host(:state(attr-current)) a {
      background: var(--sidebar-accent);
    }
    :host(:state(attr-current)) a {
      font-weight: var(--font-weight-medium);
    }
    a:focus-visible {
      box-shadow: 0 0 0 2px var(--ring);
    }
    ::slotted(svg) {
      width: calc(var(--spacing) * 4);
      height: calc(var(--spacing) * 4);
      flex-shrink: 0;
    }
  </style>

  <a part="button" _href="@href" _title="@label" _aria-current="#item.current" _role="#item.role" tabindex="0" onclick="pressed(event)" onkeydown="key(event)"><slot></slot></a>
</custom-element>

<custom-element name="ui-sidebar-trigger">
  <script>
    function toggle() {
      dispatch("sidebartoggle");
    }
  </script>

  <ui-button variant="ghost" size="icon-sm" aria-label="Toggle sidebar" onclick="toggle()">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M9 3v18" /></svg>
  </ui-button>
</custom-element>
