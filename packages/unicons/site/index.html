    <custom-element name="icon-catalog">
      <script type="realm">
        const PAGE = 240;
        const COUNT = new Intl.NumberFormat("en");
        const SWATCHES = { text: "", muted: "var(--muted-foreground)", pink: "var(--primary)" };

        const catalog = useState({
          sets: [],
          set: "lu",
          shown: { set: "lu", names: [] },
          query: "",
          limit: PAGE,
          size: "32",
          color: "",
          copied: "",
          refused: false,
          get choices() {
            return this.sets.map((set) => ({
              ...set,
              total: COUNT.format(set.count),
              option: `${set.name} (${set.id}), ${COUNT.format(set.count)}`,
              selected: set.id === this.set,
            }));
          },
          get swatch() {
            return Object.keys(SWATCHES).find((key) => SWATCHES[key] === this.color) ?? "";
          },
          get custom() {
            return this.color.startsWith("#") ? this.color : "";
          },
          get info() {
            return this.sets.find((set) => set.id === this.shown.set);
          },
          get matches() {
            const query = this.query.trim().toLowerCase();
            return query ? this.shown.names.filter((name) => name.includes(query)) : this.shown.names;
          },
          get visible() {
            return this.matches.slice(0, this.limit);
          },
          get more() {
            return this.matches.length > this.limit;
          },
          get summary() {
            return `${this.matches.length} of ${this.shown.names.length} icons`;
          },
        });

        function search(value) {
          catalog.query = value;
          catalog.limit = PAGE;
        }

        function choose(value) {
          catalog.set = value;
          catalog.limit = PAGE;
        }

        function resize(value) {
          catalog.size = String(value);
        }

        function tint(value) {
          catalog.color = SWATCHES[value] ?? "";
        }

        function paint(value) {
          catalog.color = value;
        }

        function showMore() {
          catalog.limit += PAGE;
        }

        function copy(name) {
          const token = catalog.color.match(/^var\((--[\w-]+)\)$/)?.[1];
          const color = token ? getComputedStyle(host).getPropertyValue(token).trim() : catalog.color;
          const colorAttribute = color ? ` color="${color}"` : "";
          const markup = `<u-icon set="${catalog.shown.set}" name="${name}" size="${catalog.size}"${colorAttribute}></u-icon>`;
          catalog.copied = markup;
          catalog.refused = false;
          navigator.clipboard?.writeText(markup).catch(() => {
            catalog.refused = true;
          });
        }

        observe(() => {
          const set = catalog.set;
          fetch(`./meta/${set}.json`, { signal })
            .then((response) => response.json())
            .then((names) => {
              if (catalog.set === set) catalog.shown = { set, names };
            })
            .catch(() => {});
        });
      </script>

    <custom-element name="html-code">
      <script type="realm">
        const TOKENS = /(?<punctuation><\/?|\/?>|=)|(?<tag>(?<=<\/?)[\w-]+)|(?<string>"[^"]*")|(?<attribute>[\w-]+)/g;
        const ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };

        const escape = (text) => text.replace(/[&<>"]/g, (character) => ESCAPES[character]);
        const tokens = (tag) =>
          tag.replace(TOKENS, (...match) => {
            const [kind, text] = Object.entries(match.at(-1)).find(([, value]) => value !== undefined);
            return `<span class="${kind}">${escape(text)}</span>`;
          });

        const props = defineProps({ code: prop.string().default("") });

        const sample = useState({
          get html() {
            return props.code
              .split(/(<[^>]*>)/)
              .map((part, index) => (index % 2 ? tokens(part) : escape(part)))
              .join("");
          },
        });
      </script>
