<custom-element name="realm-logo">
  <script>
    defineProps({ size: prop.number().default(28) });
  </script>

  <style>
    /* A double tap must not zoom the page. Set inside the shadow root, because a page-level
       touch-action does not reach shadow content in iOS Safari. */
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      --logo-size: calc(var(--attr-size) * 1px);
      --orb-radius: 400;
      display: inline-flex;
      align-items: center;
      gap: calc(var(--logo-size) * 0.5);
      user-select: none;
    }
    .orb {
      position: relative;
      flex: none;
      width: var(--logo-size);
      height: var(--logo-size);
    }
    .energy {
      position: absolute;
      inset: 0 auto auto 0;
      width: calc(var(--orb-radius) * 1px);
      height: calc(var(--orb-radius) * 1px);
      transform: scale(calc(var(--attr-size) / var(--orb-radius)));
      transform-origin: top left;
      pointer-events: none;
    }
    .energy span {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-full);
    }
    /* The REALM v1 orb: brand gradients drawn at 400px and scaled, so the glow keeps its proportions at every size. */
    .gradient-1 {
      background: linear-gradient(127deg, #352e73 0%, #7f3675 100%);
    }
    .gradient-2 {
      background: linear-gradient(108deg, #0147aa 0%, rgb(74 47 112 / 0.46) 28.65%, #8f3d84 51.04%, #d24972 71.35%, #e5798e 85.94%, #eab2bc 100%);
    }
    .gradient-3 {
      background: linear-gradient(115deg, #0147aa 0%, rgb(42 48 124 / 0.54) 28.13%, rgb(87 48 113 / 0) 100%);
    }
    .inner-right {
      box-shadow: -32px -9px 48px -17px #e5d3d2 inset;
    }
    .inner-left {
      box-shadow: 10px 0 44px 0 #41aed5 inset;
    }
    .outer-right {
      box-shadow: 15px 0 132px 5px #d14e76;
      animation: spin 3s linear 100;
    }
    .outer-left {
      box-shadow: -25px 0 132px -2px #02268f;
      animation: spin 3s linear 100;
    }
    .label {
      font-size: calc(var(--logo-size) * 0.8);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.2em;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .outer-right,
      .outer-left {
        animation: none;
      }
    }
  </style>

  <span class="orb" aria-hidden="true">
    <span class="energy">
      <span class="gradient-1"></span>
      <span class="gradient-2"></span>
      <span class="gradient-3"></span>
      <span class="inner-right"></span>
      <span class="inner-left"></span>
      <span class="outer-right"></span>
      <span class="outer-left"></span>
    </span>
  </span>
  <span class="label" part="text"><slot>REALM</slot></span>
</custom-element>

<custom-element name="theme-toggle">
  <script>
    const theme = useState({
      mode: document.documentElement.dataset.theme ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
      get label() {
        return this.mode === "dark" ? "Switch to light theme" : "Switch to dark theme";
      },
      get dark() {
        return this.mode === "dark";
      },
    });

    function toggle() {
      theme.mode = theme.dark ? "light" : "dark";
      document.documentElement.dataset.theme = theme.mode;
      try {
        localStorage.setItem("theme", theme.mode);
      } catch {}
    }
  </script>

  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    u-icon {
      width: calc(var(--spacing) * 4);
      height: calc(var(--spacing) * 4);
    }
  </style>

  <ui-button variant="ghost" size="icon" _aria-label="#theme.label" _title="#theme.label" onclick="toggle()">
    <is-visible when="#theme.dark"><u-icon name="sun"></u-icon></is-visible>
    <is-hidden when="#theme.dark"><u-icon name="moon"></u-icon></is-hidden>
  </ui-button>
</custom-element>

<custom-element name="site-search">
  <script>
    const props = defineProps({ root: prop.string().default("./") });

    const search = useState({
      pages: [],
      get index() {
        return `${props.root}search-index.json`;
      },
      get sections() {
        const sections = Map.groupBy(this.pages, (page) => page.section);
        return [...sections].map(([name, pages]) => ({ name, pages }));
      },
    });

    function open() {
      refs.dialog.showModal();
      queueMicrotask(() => refs.command.shadowRoot.querySelector("input").focus());
    }

    function go(event) {
      location.href = `${props.root}${event.detail.value}`;
    }

    listen(
      "keydown",
      (event) => {
        if (event.key.toLowerCase() !== "k" || !(event.metaKey || event.ctrlKey)) return;
        event.preventDefault();
        open();
      },
      document,
    );
  </script>

  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: inline-flex;
    }
    .open {
      display: inline-flex;
      align-items: center;
      gap: calc(var(--spacing) * 2);
      width: calc(var(--spacing) * 56);
      height: calc(var(--spacing) * 9);
      padding: 0 calc(var(--spacing) * 2) 0 calc(var(--spacing) * 3);
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: color-mix(in oklab, var(--muted) 50%, transparent);
      color: var(--muted-foreground);
      font: inherit;
      font-size: var(--text-sm);
      cursor: pointer;
    }
    .open:hover {
      background: var(--accent);
    }
    .open u-icon {
      width: calc(var(--spacing) * 4);
      height: calc(var(--spacing) * 4);
    }
    kbd {
      margin-left: auto;
      padding: 0 calc(var(--spacing) * 1.5);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
    }
    ui-command {
      border: 0;
      margin: calc(var(--spacing) * -6);
    }
    @media (max-width: 720px) {
      .open {
        width: calc(var(--spacing) * 9);
        padding: 0;
        justify-content: center;
      }
      kbd {
        display: none;
      }
      .open span {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    }
  </style>

  <div hidden _fetch="#search.index" trigger="load" into="#search.pages"></div>
  <button type="button" class="open" part="button" onclick="open()">
    <u-icon name="search"></u-icon>
    <span>Search docs…</span>
    <kbd>⌘K</kbd>
  </button>
  <ui-dialog ref="dialog" label="Search the documentation" hide-close>
    <ui-command ref="command" placeholder="Search the documentation…" onselect="go(event)">
      <optgroup repeat="#search.sections" as="section" key="name" _label="#section.name">
        <option repeat="#section.pages" as="page" key="url" _value="#page.url" _label="#page.title"></option>
      </optgroup>
    </ui-command>
  </ui-dialog>
</custom-element>

<custom-element name="site-layout">
  <script>
    defineProps({ label: prop.string().default("Site") });
    const layout = useState({ open: false });

    function toggle() {
      layout.open = !layout.open;
    }

    function close(event) {
      if (event.target.closest?.("a")) layout.open = false;
    }

    observe(() => {
      if (layout.open) internals.states.add("open");
      else internals.states.delete("open");
    });
  </script>

  <style>

      margin: 0 auto;
      padding: 0 calc(var(--spacing) * 6);
    }
    .nav {
      position: sticky;
      top: calc(var(--spacing) * 14);
      height: calc(100svh - calc(var(--spacing) * 14));
      overflow-y: auto;
      padding: calc(var(--spacing) * 6) 0;
    }
    .toc {
      position: sticky;
      top: calc(var(--spacing) * 14);

    }
    main {
      min-width: 0;

    }

    }
    :host([wide]) {

<custom-element name="code-block">
  <script>
    const props = defineProps({ language: prop.string().default("") });
    const copy = useState({ done: false });

    async function copyCode() {
      const code = host.querySelector("pre").textContent;
      try {
        await navigator.clipboard.writeText(code);
        copy.done = true;
        setTimeout(() => (copy.done = false), 1500);
      } catch {
        document.dispatchEvent(new CustomEvent("toast", { detail: { title: "Copy failed", variant: "destructive" } }));
      }
    }
  </script>

  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      position: relative;
      display: block;
      margin: calc(var(--spacing) * 5) 0;
    }
    .copy {
      position: absolute;
      top: calc(var(--spacing) * 2);
      right: calc(var(--spacing) * 2);
      opacity: 0;
      transition: opacity var(--default-transition-duration);
    }
    :host(:hover) .copy,
    .copy:focus-within {
      opacity: 1;
    }
    .language {
      position: absolute;
      top: calc(var(--spacing) * 2.4);
      right: calc(var(--spacing) * 12);
      font-size: var(--text-xs);
      color: var(--muted-foreground);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .copy u-icon {
      width: calc(var(--spacing) * 3.5);
      height: calc(var(--spacing) * 3.5);
    }
    @media (max-width: 40rem) {
      .language {
        display: none;
      }
    }
  </style>

  <slot></slot>
  <span class="language"><slot name="@language"></slot></span>
  <ui-button class="copy" variant="ghost" size="icon-sm" aria-label="Copy code" onclick="copyCode()">
    <is-hidden when="#copy.done"><u-icon name="copy"></u-icon></is-hidden>
    <is-visible when="#copy.done"><u-icon name="check"></u-icon></is-visible>
  </ui-button>
</custom-element>

<custom-element name="live-demo">
  <script>
    const sized = new ResizeObserver((entries) => {
      for (const { target } of entries) {
        if (!target.clientHeight) continue;
        sized.unobserve(target);
        const body = [...target.querySelectorAll(".line")].find((line) => line.textContent.trim() === "<body>");
        target.scrollTop = body.getBoundingClientRect().top - target.getBoundingClientRect().top - 16;
      }
    });

    onConnected(() => {
      if (attrs.layout !== "split") return;
      for (const pre of host.querySelectorAll(".shiki")) if (pre.textContent.includes("<body>")) sized.observe(pre);
    });
    onDisconnected(() => sized.disconnect());
  </script>

  <style>
    :host,
    * {
      touch-action: manipulation;
    }
    :host {
      display: block;
      margin: calc(var(--spacing) * 6) 0;
    }
    :host([layout="stacked"]) {
      display: grid;
      gap: calc(var(--spacing) * 3);
    }
    :host([layout="split"]) {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
      gap: calc(var(--spacing) * 4);
      align-items: start;
    }
    ::slotted(ui-tabs) {
      min-width: 0;
    }
    :host([layout="split"]) ::slotted(ui-tabs) {
      grid-row: 1;
    }
    @media (max-width: 860px) {
      :host([layout="split"]) {
        grid-template-columns: minmax(0, 1fr);
      }
      :host([layout="split"]) ::slotted(ui-tabs) {
        grid-row: auto;
      }
    }
  </style>

  <slot></slot>
</custom-element>
