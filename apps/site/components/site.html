<custom-element name="theme-toggle">
  <script>
    const theme = useState({
      mode: document.documentElement.dataset.theme ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
      get label() {
        return this.mode === "dark" ? "Switch to light theme" : "Switch to dark theme";
      },
      get dark() {
        return this.mode === "dark";
      },
    });

    function toggle() {
      theme.mode = theme.dark ? "light" : "dark";
      document.documentElement.dataset.theme = theme.mode;
      try {
        localStorage.setItem("theme", theme.mode);
      } catch {}
    }
  </script>

  <ui-button variant="ghost" size="icon" _aria-label="#theme.label" _title="#theme.label" onclick="toggle()">
    <is-visible when="#theme.dark">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
    </is-visible>
    <is-hidden when="#theme.dark">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>
    </is-hidden>
  </ui-button>
</custom-element>

<custom-element name="site-search">
  <script>
    const props = defineProps({ root: prop.string().default("./") });

    const search = useState({
      pages: [],
      get index() {
        return `${props.root}search-index.json`;
      },
      get sections() {
        const sections = Map.groupBy(this.pages, (page) => page.section);
        return [...sections].map(([name, pages]) => ({ name, pages }));
      },
    });

    function open() {
      refs.dialog.showModal();
      queueMicrotask(() => refs.command.shadowRoot.querySelector("input").focus());
    }

    function go(event) {
      location.href = `${props.root}${event.detail.value}`;
    }

    listen(
      "keydown",
      (event) => {
        if (event.key.toLowerCase() !== "k" || !(event.metaKey || event.ctrlKey)) return;
        event.preventDefault();
        open();
      },
      document,
    );
  </script>

  <style>
    :host {
      display: inline-flex;
    }
    .open {
      display: inline-flex;
      align-items: center;
      gap: calc(var(--spacing) * 2);
      width: calc(var(--spacing) * 56);
      height: calc(var(--spacing) * 9);
      padding: 0 calc(var(--spacing) * 2) 0 calc(var(--spacing) * 3);
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: color-mix(in oklab, var(--muted) 50%, transparent);
      color: var(--muted-foreground);
      font: inherit;
      font-size: var(--text-sm);
      cursor: pointer;
    }
    .open:hover {
      background: var(--accent);
    }
    kbd {
      margin-left: auto;
      padding: 0 calc(var(--spacing) * 1.5);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
    }
    ui-command {
      border: 0;
      margin: calc(var(--spacing) * -6);
    }
    @media (max-width: 720px) {
      .open {
        width: calc(var(--spacing) * 9);
        padding: 0;
        justify-content: center;
      }
      kbd {
        display: none;
      }
      .open span {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    }
  </style>

  <div hidden _fetch="#search.index" trigger="load" into="#search.pages"></div>
  <button type="button" class="open" part="button" onclick="open()">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
    <span>Search docs…</span>
    <kbd>⌘K</kbd>
  </button>
  <ui-dialog ref="dialog" label="Search the documentation" hide-close>
    <ui-command ref="command" placeholder="Search the documentation…" onselect="go(event)">
      <optgroup repeat="#search.sections" as="section" key="name" _label="#section.name">
        <option repeat="#section.pages" as="page" key="url" _value="#page.url" _label="#page.title"></option>
      </optgroup>
    </ui-command>
  </ui-dialog>
</custom-element>

<custom-element name="site-header">
  <script>
    const props = defineProps({
      root: prop.string().default("./"),
      section: prop.string().default("home"),
    });

    const nav = useState({
      get home() {
        return props.root;
      },
      get links() {
        return [
          { id: "docs", label: "Docs" },
          { id: "components", label: "Components" },
          { id: "examples", label: "Examples" },
          { id: "reference", label: "Reference" },
          { id: "blog", label: "Blog" },
        ].map((link) => ({ ...link, href: `${props.root}${link.id}/`, current: link.id === props.section ? "page" : null }));
      },
    });
  </script>

  <style>
    :host {
      position: sticky;
      top: 0;
      z-index: 40;
      display: block;
      border-bottom: 1px solid var(--border);
      background: color-mix(in oklab, var(--background) 85%, transparent);
      backdrop-filter: blur(12px);
    }
    header {
      display: flex;
      align-items: center;
      gap: calc(var(--spacing) * 6);
      max-width: calc(var(--spacing) * 360);
      height: calc(var(--spacing) * 14);
      margin: 0 auto;
      padding: 0 calc(var(--spacing) * 6);
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    nav {
      display: flex;
      gap: calc(var(--spacing) * 5);
      font-size: var(--text-sm);
    }
    nav a {
      color: var(--muted-foreground);
      transition: color var(--default-transition-duration);
    }
    nav a:hover,
    nav a[aria-current="page"] {
      color: var(--foreground);
    }
    .icon-link {
      display: inline-grid;
      place-content: center;
      width: calc(var(--spacing) * 9);
      height: calc(var(--spacing) * 9);
      border-radius: var(--radius-md);
    }
    .icon-link:hover {
      background: var(--accent);
    }
    .icon-link:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }
    .actions {
      display: flex;
      align-items: center;
      gap: calc(var(--spacing) * 1);
      margin-left: auto;
    }
    @media (max-width: 860px) {
      nav {
        display: none;
      }
    }
  </style>

  <header part="header">
    <a _href="#nav.home" aria-label="REALM home"><realm-logo></realm-logo></a>
    <nav aria-label="Main">
      <repeat-list of="#nav.links" as="link" key="id">
        <a _href="#link.href" _aria-current="#link.current"><slot name="#link.label"></slot></a>
      </repeat-list>
    </nav>
    <div class="actions">
      <site-search _root="@root"></site-search>
      <theme-toggle></theme-toggle>
      <a class="icon-link" href="https://github.com/realmui/realm" rel="noopener" target="_blank" aria-label="REALM on GitHub">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.7.5.5 5.7.5 12a11.5 11.5 0 0 0 7.9 10.9c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 23.5 12C23.5 5.7 18.3.5 12 .5Z" /></svg>
      </a>
    </div>
  </header>
</custom-element>

<custom-element name="site-layout">
  <script>
    const layout = useState({ open: false });

    function toggle() {
      layout.open = !layout.open;
    }

    function close(event) {
      if (event.target.closest?.("a")) layout.open = false;
    }

    observe(() => {
      if (layout.open) internals.states.add("open");
      else internals.states.delete("open");
    });
  </script>

  <style>
    :host {
      display: grid;
      grid-template-columns: calc(var(--spacing) * 64) minmax(0, 1fr) calc(var(--spacing) * 56);
      gap: calc(var(--spacing) * 12);
      max-width: calc(var(--spacing) * 360);
      margin: 0 auto;
      padding: 0 calc(var(--spacing) * 6);
    }
    .nav {
      position: sticky;
      top: calc(var(--spacing) * 14);
      height: calc(100dvh - calc(var(--spacing) * 14));
      overflow-y: auto;
      padding: calc(var(--spacing) * 6) 0;
    }
    .toc {
      position: sticky;
      top: calc(var(--spacing) * 14);
      height: fit-content;
      padding: calc(var(--spacing) * 8) 0;
    }
    main {
      min-width: 0;
      padding: calc(var(--spacing) * 8) 0 calc(var(--spacing) * 16);
    }
    .menu {
      display: none;
    }
    @media (max-width: 1200px) {
      :host {
        grid-template-columns: calc(var(--spacing) * 60) minmax(0, 1fr);
      }
      .toc {
        display: none;
      }
    }
    @media (max-width: 860px) {
      :host {
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
      }
      .menu {
        display: inline-flex;
        margin-top: calc(var(--spacing) * 4);
      }
      .nav {
        display: none;
      }
      :host(:state(open)) .nav {
        position: static;
        display: block;
        height: auto;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>

  <div class="menu">
    <ui-button variant="outline" size="sm" onclick="toggle()">Menu</ui-button>
  </div>
  <div class="nav" part="nav" onclick="close(event)"><slot name="nav"></slot></div>
  <main part="main"><slot></slot></main>
  <div class="toc" part="toc"><slot name="toc"></slot></div>
</custom-element>

<custom-element name="code-block">
  <script>
    const props = defineProps({ language: prop.string().default("") });
    const copy = useState({ done: false });

    async function copyCode() {
      const code = host.querySelector("pre").textContent;
      try {
        await navigator.clipboard.writeText(code);
        copy.done = true;
        setTimeout(() => (copy.done = false), 1500);
      } catch {
        document.dispatchEvent(new CustomEvent("toast", { detail: { title: "Copy failed", variant: "destructive" } }));
      }
    }
  </script>

  <style>
    :host {
      position: relative;
      display: block;
      margin: calc(var(--spacing) * 5) 0;
    }
    .copy {
      position: absolute;
      top: calc(var(--spacing) * 2);
      right: calc(var(--spacing) * 2);
      opacity: 0;
      transition: opacity var(--default-transition-duration);
    }
    :host(:hover) .copy,
    .copy:focus-within {
      opacity: 1;
    }
    .language {
      position: absolute;
      top: calc(var(--spacing) * 2.4);
      right: calc(var(--spacing) * 12);
      font-size: var(--text-xs);
      color: var(--muted-foreground);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    @media (max-width: 40rem) {
      .language {
        display: none;
      }
    }
  </style>

  <slot></slot>
  <span class="language"><slot name="@language"></slot></span>
  <ui-button class="copy" variant="ghost" size="icon-sm" aria-label="Copy code" onclick="copyCode()">
    <is-hidden when="#copy.done">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg>
    </is-hidden>
    <is-visible when="#copy.done">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5" /></svg>
    </is-visible>
  </ui-button>
</custom-element>
