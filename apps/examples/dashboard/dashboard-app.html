<custom-element name="dashboard-app">
  <script type="module">
    import { invoices, months, navigation, sales, stats } from "./data.js";

    const PAGE_SIZE = 6;
    const COLUMNS = [
      { key: "id", label: "Invoice" },
      { key: "status", label: "Status" },
      { key: "method", label: "Method" },
      { key: "amount", label: "Amount" },
    ];
    const SERIES = { overview: "desktop,mobile", desktop: "desktop", mobile: "mobile" };

    const view = useState({
      section: "dashboard",
      page: 1,
      series: "overview",
      stats,
      sales,
      months,
      columns: COLUMNS,
      get nav() {
        return navigation.map((item) => ({ ...item, current: item.id === this.section, href: `#${item.id}` }));
      },
      get title() {
        return navigation.find((item) => item.id === this.section).label;
      },
      get pages() {
        return Math.ceil(invoices.length / PAGE_SIZE);
      },
      get rows() {
        return invoices.slice((this.page - 1) * PAGE_SIZE, this.page * PAGE_SIZE);
      },
      get y() {
        return SERIES[this.series];
      },
      get commands() {
        return navigation.map((item) => ({ value: item.id, label: item.label }));
      },
    });

    function navigate(id) {
      view.section = id;
      document.dispatchEvent(new CustomEvent("toast", { detail: { title: `Opened ${view.title}` } }));
    }

    function search() {
      refs.palette.showModal();
    }

    function run(event) {
      refs.palette.close();
      navigate(event.detail.value);
    }

    function paged(event) {
      view.page = event.detail.page;
    }

    function chartTab(tabs) {
      view.series = tabs.value;
    }

    function account(event) {
      document.dispatchEvent(new CustomEvent("toast", { detail: { title: event.detail.value === "logout" ? "Signed out" : "Opening profile" } }));
    }

    function shortcut(event) {
      if (event.key.toLowerCase() !== "k" || !(event.metaKey || event.ctrlKey)) return;
      event.preventDefault();
      search();
    }

    listen("keydown", shortcut, document);
  </script>

  <style>
    :host {
      display: block;
    }
    header {
      display: flex;
      align-items: center;
      gap: calc(var(--spacing) * 3);
      height: calc(var(--spacing) * 14);
      padding: 0 calc(var(--spacing) * 4);
      border-bottom: 1px solid var(--border);
    }
    header ui-separator {
      height: calc(var(--spacing) * 4);
      align-self: center;
    }
    .search {
      margin-left: auto;
    }
    .content {
      display: grid;
      gap: calc(var(--spacing) * 4);
      padding: calc(var(--spacing) * 6);
    }
    h1 {
      margin: 0;
      font-size: var(--text-2xl);
      letter-spacing: -0.02em;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(calc(var(--spacing) * 52), 1fr));
      gap: calc(var(--spacing) * 4);
    }
    .stat-value {
      margin: 0;
      font-size: var(--text-2xl);
      font-weight: var(--font-weight-bold);
    }
    .stat-change {
      margin: calc(var(--spacing) * 1) 0 0;
      font-size: var(--text-xs);
      color: var(--muted-foreground);
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      gap: calc(var(--spacing) * 4);
    }
    .sales {
      display: grid;
      gap: calc(var(--spacing) * 5);
    }
    .sale {
      display: flex;
      align-items: center;
      gap: calc(var(--spacing) * 3);
      font-size: var(--text-sm);
    }
    .sale div {
      flex: 1;
      min-width: 0;
    }
    .sale p {
      margin: 0;
    }
    .sale small {
      color: var(--muted-foreground);
    }
    .icon {
      display: inline-grid;
      place-content: center;
      flex-shrink: 0;
      width: calc(var(--spacing) * 4);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: calc(var(--spacing) * 2);
      padding: calc(var(--spacing) * 2);
      font-weight: var(--font-weight-semibold);
    }
    .logo {
      display: grid;
      place-content: center;
      width: calc(var(--spacing) * 8);
      height: calc(var(--spacing) * 8);
      border-radius: var(--radius-md);
      background: var(--primary);
      color: var(--primary-foreground);
    }
    @media (max-width: 1000px) {
      .grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>

  <ui-sidebar-layout persist="realm-dashboard-sidebar">
    <ui-sidebar>
      <ui-sidebar-header>
        <div class="brand"><span class="logo">R</span><span>Acme Inc</span></div>
      </ui-sidebar-header>
      <ui-sidebar-content>
        <ui-sidebar-group>
          <ui-sidebar-group-label>Platform</ui-sidebar-group-label>
          <ui-sidebar-menu>
            <ui-sidebar-menu-item repeat="#view.nav" as="item" key="id">
              <ui-sidebar-menu-button _href="#item.href" _current="#item.current" _label="#item.label" onselect="navigate(item.id)">
                <span class="icon" aria-hidden="true"><slot name="#item.icon"></slot></span>
                <slot name="#item.label"></slot>
              </ui-sidebar-menu-button>
            </ui-sidebar-menu-item>
          </ui-sidebar-menu>
        </ui-sidebar-group>
      </ui-sidebar-content>
      <ui-sidebar-footer>
        <ui-dropdown-menu onselect="account(event)">
          <ui-dropdown-menu-trigger>
            <ui-button variant="ghost">
              <ui-avatar size="sm"><ui-avatar-fallback>SC</ui-avatar-fallback></ui-avatar> shadcn
            </ui-button>
          </ui-dropdown-menu-trigger>
          <ui-dropdown-menu-content placement="top-start">
            <ui-menu-item value="profile">Profile</ui-menu-item>
            <ui-menu-item value="logout" variant="destructive">Log out</ui-menu-item>
          </ui-dropdown-menu-content>
        </ui-dropdown-menu>
      </ui-sidebar-footer>
    </ui-sidebar>

    <ui-sidebar-inset>
      <header>
        <ui-sidebar-trigger></ui-sidebar-trigger>
        <ui-separator orientation="vertical"></ui-separator>
        <ui-breadcrumb>
          <ui-breadcrumb-list>
            <ui-breadcrumb-item><ui-breadcrumb-link href="#">Acme</ui-breadcrumb-link></ui-breadcrumb-item>
            <ui-breadcrumb-separator></ui-breadcrumb-separator>
            <ui-breadcrumb-item><ui-breadcrumb-page><slot name="#view.title"></slot></ui-breadcrumb-page></ui-breadcrumb-item>
          </ui-breadcrumb-list>
        </ui-breadcrumb>
        <ui-button class="search" variant="outline" size="sm" onclick="search()">Search… <ui-kbd>⌘K</ui-kbd></ui-button>
      </header>

      <section class="content">
        <h1><slot name="#view.title"></slot></h1>
        <div class="stats">
          <repeat-list of="#view.stats" as="stat" key="id">
            <ui-card>
              <ui-card-header>
                <ui-card-description><slot name="#stat.label"></slot></ui-card-description>
              </ui-card-header>
              <ui-card-content>
                <p class="stat-value"><slot name="#stat.value"></slot></p>
                <p class="stat-change"><slot name="#stat.change"></slot></p>
              </ui-card-content>
            </ui-card>
          </repeat-list>
        </div>

        <div class="grid">
          <ui-card>
            <ui-card-header>
              <ui-card-title level="2">Overview</ui-card-title>
              <ui-card-description>Visitors for the last 6 months</ui-card-description>
              <ui-card-action>
                <ui-tabs value="overview" onchange="chartTab(this)">
                  <ui-tabs-list>
                    <ui-tabs-trigger value="overview">All</ui-tabs-trigger>
                    <ui-tabs-trigger value="desktop">Desktop</ui-tabs-trigger>
                    <ui-tabs-trigger value="mobile">Mobile</ui-tabs-trigger>
                  </ui-tabs-list>
                </ui-tabs>
              </ui-card-action>
            </ui-card-header>
            <ui-card-content>
              <ui-chart x="month" _y="#view.y" _data="#view.months" label="Visitors per month"></ui-chart>
            </ui-card-content>
          </ui-card>
          <ui-card>
            <ui-card-header>
              <ui-card-title level="2">Recent sales</ui-card-title>
              <ui-card-description>You made 265 sales this month.</ui-card-description>
            </ui-card-header>
            <ui-card-content class="sales">
              <repeat-list of="#view.sales" as="sale" key="id">
                <div class="sale">
                  <ui-avatar><ui-avatar-fallback><slot name="#sale.initials"></slot></ui-avatar-fallback></ui-avatar>
                  <div><p><slot name="#sale.name"></slot></p><small><slot name="#sale.email"></slot></small></div>
                  <strong><slot name="#sale.amount"></slot></strong>
                </div>
              </repeat-list>
            </ui-card-content>
          </ui-card>
        </div>

        <ui-card>
          <ui-card-header>
            <ui-card-title level="2">Invoices</ui-card-title>
          </ui-card-header>
          <ui-card-content>
            <ui-table _columns="#view.columns" _rows="#view.rows" caption="A list of your recent invoices."></ui-table>
          </ui-card-content>
          <ui-card-footer justify="end">
            <ui-pagination _page="#view.page" _total="#view.pages" onchange="paged(event)"></ui-pagination>
          </ui-card-footer>
        </ui-card>
      </section>
    </ui-sidebar-inset>
  </ui-sidebar-layout>

  <ui-dialog ref="palette" label="Search pages" hide-close>
    <ui-command placeholder="Search pages…" onselect="run(event)">
      <optgroup label="Pages">
        <option repeat="#view.commands" as="command" key="value" _value="#command.value" _label="#command.label"></option>
      </optgroup>
    </ui-command>
  </ui-dialog>
</custom-element>
