<import-element from="https://cdn.jsdelivr.net/npm/@realmorg/ui@alpha/components/alert-dialog.html"></import-element>
<import-element from="https://cdn.jsdelivr.net/npm/@realmorg/ui@alpha/components/button.html"></import-element>
<import-element from="https://cdn.jsdelivr.net/npm/@realmorg/ui@alpha/components/empty.html"></import-element>
<import-element from="https://cdn.jsdelivr.net/npm/@realmorg/ui@alpha/components/textarea.html"></import-element>
<import-element from="https://cdn.jsdelivr.net/npm/@realmorg/ui@alpha/components/toggle-group.html"></import-element>

<custom-element name="note-editor">
  <script type="module">
    import { notes, removeCurrent, togglePin, write } from "./notes.js";

    function typed(field) {
      write(field.value);
    }

    function show(group) {
      notes.view = group.value;
    }

    function confirmDelete() {
      refs.confirm.showModal();
    }

    function closed(dialog) {
      if (dialog.returnValue === "delete") removeCurrent();
    }

    defineMethods({
      edit() {
        refs.text.focus();
      },
    });
  </script>

  <style>
    :host {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: calc(var(--spacing) * 2);
      padding: calc(var(--spacing) * 3) calc(var(--spacing) * 4);
      border-bottom: 1px solid var(--border);
    }
    h2 {
      flex: 1;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      font-size: var(--text-base);
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .panes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      min-height: 0;
    }
    :host(:state(state-notes-view-is-write)) .panes,
    :host(:state(state-notes-view-is-preview)) .panes {
      grid-template-columns: minmax(0, 1fr);
    }
    :host(:state(state-notes-view-is-write)) .preview,
    :host(:state(state-notes-view-is-preview)) .write {
      display: none;
    }
    .write {
      display: grid;
      min-height: 0;
      padding: calc(var(--spacing) * 4);
    }
    .write ui-textarea::part(textarea) {
      height: 100%;
      resize: none;
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      line-height: var(--leading-normal);
    }
    .preview {
      min-height: 0;
      overflow-y: auto;
      padding: calc(var(--spacing) * 2) calc(var(--spacing) * 6);
      border-left: 1px solid var(--border);
      line-height: var(--leading-normal);
    }
    :host(:state(state-notes-view-is-preview)) .preview {
      border-left: 0;
    }
    .preview h3,
    .preview h4,
    .preview h5,
    .preview h6 {
      margin: calc(var(--spacing) * 5) 0 calc(var(--spacing) * 2);
      line-height: var(--leading-tight);
    }
    .preview h3 {
      font-size: var(--text-2xl);
      letter-spacing: -0.02em;
    }
    .preview h4 {
      font-size: var(--text-lg);
    }
    .preview code {
      padding: 0 calc(var(--spacing) * 1);
      border-radius: var(--radius-sm);
      background: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.9em;
    }
    .preview pre {
      overflow-x: auto;
      padding: calc(var(--spacing) * 3);
      border-radius: var(--radius-md);
      background: var(--muted);
    }
    .preview pre code {
      padding: 0;
    }
    .preview blockquote {
      margin: calc(var(--spacing) * 4) 0;
      padding-left: calc(var(--spacing) * 4);
      border-left: 3px solid var(--border);
      color: var(--muted-foreground);
    }
    .preview a {
      color: var(--primary);
    }
    .preview hr {
      border: 0;
      border-top: 1px solid var(--border);
    }
    ui-empty {
      align-self: center;
    }
    @media (max-width: 720px) {
      .panes {
        grid-template-columns: minmax(0, 1fr);
      }
      .write ui-textarea::part(textarea) {
        min-height: calc(var(--spacing) * 60);
      }
      .preview {
        border-left: 0;
        border-top: 1px solid var(--border);
        padding-inline: calc(var(--spacing) * 4);
      }
      :host(:state(state-notes-view-is-preview)) .preview {
        border-top: 0;
      }
    }
  </style>

  <is-visible when="#notes.current">
    <header>
      <h2><slot name="#notes.title"></slot></h2>
      <ui-toggle-group aria-label="View" _value="#notes.view" onchange="show(this)">
        <ui-toggle value="write" size="sm">Write</ui-toggle>
        <ui-toggle value="split" size="sm">Split</ui-toggle>
        <ui-toggle value="preview" size="sm">Preview</ui-toggle>
      </ui-toggle-group>
      <ui-toggle size="sm" aria-label="Pin note" aria-keyshortcuts="Alt+P" _pressed="#notes.current.pinned" onchange="togglePin()"><u-icon name="pin"></u-icon></ui-toggle>
      <ui-button variant="ghost" size="icon-sm" aria-label="Delete note" onclick="confirmDelete()"><u-icon name="trash-2"></u-icon></ui-button>
    </header>
    <div class="panes">
      <div class="write">
        <ui-textarea ref="text" aria-label="Note text" _value="#notes.current.body" oninput="typed(this)"></ui-textarea>
      </div>
      <article class="preview" aria-label="Preview"><slot name="#notes.preview" html></slot></article>
    </div>
  </is-visible>

  <is-hidden when="#notes.current">
    <ui-empty>
      <ui-empty-header>
        <ui-empty-media variant="icon"><u-icon name="notebook-pen"></u-icon></ui-empty-media>
        <ui-empty-title level="2">No note selected</ui-empty-title>
        <ui-empty-description>Pick a note from the list, or press Alt+N to start a new one.</ui-empty-description>
      </ui-empty-header>
    </ui-empty>
  </is-hidden>

  <ui-alert-dialog ref="confirm" onclose="closed(this)">
    <ui-alert-dialog-header>
      <ui-alert-dialog-title>Delete this note?</ui-alert-dialog-title>
      <ui-alert-dialog-description>“<slot name="#notes.title"></slot>” will be removed from this browser.</ui-alert-dialog-description>
    </ui-alert-dialog-header>
    <ui-alert-dialog-footer>
      <ui-alert-dialog-cancel>Cancel</ui-alert-dialog-cancel>
      <ui-alert-dialog-action value="delete" variant="destructive">Delete</ui-alert-dialog-action>
    </ui-alert-dialog-footer>
  </ui-alert-dialog>
</custom-element>
