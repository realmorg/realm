<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A shop built with REALM: product grid, filters, product pages and a cart, written as web components in plain HTML with no build step.">
  <link rel="canonical" href="https://realm.js.org/examples/shop/">
  <title>Products · Shop · REALM examples</title>
  <link rel="stylesheet" href="https://realm.js.org/dist/realm.css">
  <link rel="stylesheet" href="https://realm.js.org/dist/ui/theme.css">
  <script type="module" src="https://realm.js.org/dist/realm.js"></script>
  <style>
    body { margin: 0; min-height: 100svh; }
    main { width: min(70rem, 100%); margin: 0 auto; padding: 2rem 1rem 4rem; box-sizing: border-box; }
  </style>
</head>
<body>
  <import-element from="https://realm.js.org/dist/ui/components/toaster.html"></import-element>
  <import-element from="https://realm.js.org/dist/unicons/unicons.html"></import-element>
  <import-element from="./components/shop-header.html"></import-element>
  <import-element from="./components/product-list.html"></import-element>
  <shop-header page="products"></shop-header>
  <main><product-list></product-list></main>
  <ui-toaster></ui-toaster>
</body>
</html>
